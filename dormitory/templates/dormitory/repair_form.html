{% extends 'dormitory/base.html' %}
{% block title %}申请维修{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow">
      <div class="card-header bg-primary text-white"><h5 class="mb-0">申请维修</h5></div>
      <div class="card-body">
        <form method="post">
          {% csrf_token %}
          {% include 'dormitory/form_fields.html' %}
          {% if user.role == 'admin' %}
            <div class="mb-3">
              <label class="form-label">申请人（学生）<span class="text-danger">*</span></label>
              <select name="applicant" class="form-select" required>
                <option value="">请选择申请人</option>
                {% for s in students %}
                  <option value="{{ s.pk }}">{{ s.name }}（{{ s.student_no }}）</option>
                {% endfor %}
              </select>
            </div>
          {% endif %}
          <button type="submit" class="btn btn-primary">提交申请</button>
          <a href="{% url 'repair_list' %}" class="btn btn-secondary">返回</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
