{% extends 'dormitory/base.html' %}
{% block title %}注册 - 宿舍管理系统{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow">
      <div class="card-header bg-success text-white text-center"><h4 class="mb-0">学生注册</h4></div>
      <div class="card-body">
        {% if form.non_field_errors %}
          <div class="alert alert-danger">{{ form.non_field_errors }}</div>
        {% endif %}
        <form method="post">
          {% csrf_token %}
          {% include 'dormitory/form_fields.html' %}
          <button type="submit" class="btn btn-success w-100">注册</button>
        </form>
        <div class="mt-3 text-center">已有账号？<a href="{% url 'login' %}">去登录</a></div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
