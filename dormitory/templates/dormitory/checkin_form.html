{% extends 'dormitory/base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow">
      <div class="card-header bg-primary text-white"><h5 class="mb-0">{{ title }}</h5></div>
      <div class="card-body">
        <form method="post">
          {% csrf_token %}
          {% include 'dormitory/form_fields.html' %}
          <button type="submit" class="btn btn-primary">保存</button>
          <a href="{% url 'checkin_list' %}" class="btn btn-secondary">返回</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
