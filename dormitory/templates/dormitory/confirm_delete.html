{% extends 'dormitory/base.html' %}
{% block title %}确认删除{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow">
      <div class="card-header bg-danger text-white"><h5 class="mb-0">确认删除</h5></div>
      <div class="card-body">
        <p>确定要删除「<strong>{{ obj }}</strong>」吗？该操作不可恢复，相关关联数据可能一并删除。</p>
        <form method="post">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger">确认删除</button>
          <a href="{{ cancel_url }}" class="btn btn-secondary">取消</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
